    <meta charset="utf-8" />
    {{ with .Params.meta_x_ua_compatible }}<meta http-equiv="X-UA-Compatible" content="{{ . }}" />{{ end }}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The above meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <meta name="description" content="{{ .Params.description }}"/>
    <meta name="author" content="{{ .Params.author }}"/>
    <link rel="icon" href="/assets/kpb.ico" />

    <title>{{ .Title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@{{ .Params.bootstrap_version }}/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="{{ .Params.bootstrap_integrity }}"
          crossorigin="anonymous">
    <link href="/assets/css/kb.com.css" rel="stylesheet"/>
    {{ with .Params.extra_css }}
      {{ range . }}
    <link href="{{ . }}" rel="stylesheet">
      {{ end }}
    {{ end }}
