{{ define "main" }}
    <div class="page-row page-row-expanded">
      <div class="container-fluid main-content">
        <h2>Tags</h2>
        <ul class="list-unstyled">
          {{ range .Data.Terms.Alphabetical }}
          <li>
            <a href="{{ .Page.RelPermalink }}">{{ lower .Page.LinkTitle }}</a>
            ({{ .Count }})
          </li>
          {{ end }}
        </ul>
      </div>
    </div>
{{ end }}
